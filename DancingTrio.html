<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Trio Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font globally */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Keyframes for bounce animation */
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px); /* Bounce up slightly */
            }
        }

        /* Style for preformatted text */
        .ascii-art {
            white-space: pre;
            font-family: monospace;
            line-height: 1.1;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            overflow: visible;
            text-align: center;
            /* Hints for GPU layer and rendering optimization */
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
            /* Animation properties will be applied via JS on click */
        }

        /* Style for floating music notes */
        .music-note {
            position: absolute;
            transition: top 1s linear;
            pointer-events: none;
            font-size: clamp(1rem, 3vw, 1.5rem);
        }

        /* Styles for Fireworks */
        .fireworks-container {
            position: absolute;
            width: 1px;
            height: 1px;
            pointer-events: none; /* Don't interfere with clicks */
        }
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            opacity: 1;
            transform: translate(-50%, -50%);
            transition: transform 0.8s cubic-bezier(0.1, 0.8, 0.7, 1), opacity 0.8s ease-out;
        }

        /* Style for control buttons using Tailwind @apply */
        .control-button {
            @apply bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1 rounded-md shadow cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed;
        }
        /* Style for the main start button */
        .start-button {
             @apply bg-green-600 hover:bg-green-700 text-white text-lg font-semibold px-6 py-3 rounded-lg shadow-lg cursor-pointer transition-colors;
        }
        /* Ensure main content area fills available vertical space */
        #main-content {
            height: calc(100vh - 4rem);
        }
        /* Ensure animation area uses available vertical space */
        #animation-area {
             height: calc(100% - 4rem);
             max-height: 80vh;
             cursor: pointer; /* Add pointer cursor to indicate clickability */
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <button id="start-button" class="start-button" aria-label="Start Dancing Trio Animation">Start Dancing Trio</button>
    <div id="credit-text" class="text-gray-400 text-xs mt-2">Created by Paula & Gavin</div>

    <div id="main-content" class="hidden w-full flex flex-col items-center justify-center flex-grow">

        <div class="fixed top-2 left-2 right-2 z-20 px-2 flex flex-col space-y-1 sm:space-y-0 sm:flex-row sm:justify-between sm:items-center">

            <div id="status-display" class="bg-gray-800 text-yellow-400 px-3 py-1 rounded-lg text-sm shadow-md w-full text-center sm:w-auto sm:text-left sm:max-w-[calc(100%-200px)] sm:truncate">
                Status: Initializing...
            </div>

            <div class="flex space-x-2 self-center sm:self-auto">
                <button id="next-song-button" class="control-button" aria-label="Play Next Song">Next Song</button>
                <button id="fullscreen-button" class="control-button" aria-label="Toggle Fullscreen Mode">Fullscreen</button>
            </div>
        </div>

        <div id="animation-area" class="relative w-full max-w-4xl border border-gray-700 rounded-lg overflow-hidden bg-gray-800 shadow-xl mt-20 mb-16 flex items-end justify-center">
            <div id="background-elements" class="absolute inset-0 z-0"></div>
            <div id="music-notes" class="absolute inset-0 z-20 pointer-events-none"></div>
            <div id="characters" class="relative flex justify-center items-end gap-4 md:gap-6 z-10 mb-4">
                <div id="turtle" class="ascii-art"></div>
                <div id="frog" class="ascii-art"></div>
                <div id="mushroom" class="ascii-art"></div>
            </div>
            <div id="ground" class="absolute bottom-1 left-[10%] right-[10%] h-1 bg-green-700 rounded"></div>
            </div>
    </div>

    <audio id="audio-player" controls class="hidden" crossOrigin="anonymous"></audio>

    <script>
        // --- Constants ---
        const ANIMATION_DELAY_MS = 180;
        const AUDIO_LOAD_TIMEOUT_MS = 10000;
        const MUSIC_NOTE_SPAWN_CHANCE = 0.15;
        const MUSIC_NOTE_MAX_HEIGHT_PCT = 80;
        const CHARACTER_COLOR_CHANGE_INTERVAL = 3;
        const BACKGROUND_CHANGE_INTERVAL = 5;
        const APPLE_PLATFORMS_REGEX = /Mac|iPod|iPhone|iPad/;
        const BOUNCE_DURATION = '0.8s';
        const EFFECT_DURATION_PER_CLICK_MS = 3000; // Duration added per click
        const FIREWORK_PARTICLE_COUNT = 15;
        const FIREWORK_SPREAD = 60; // pixels
        const FIREWORK_DURATION_MS = 800;
        const FIREWORK_COLORS = ['#ffdd57', '#ff3860', '#23d160', '#55acee', '#ff4500', '#ffffff'];
        const TARGET_FIREWORK_COUNT_PER_CLICK = 15; // Fireworks per 3-sec interval
        const FIREWORK_INTERVAL_MS = EFFECT_DURATION_PER_CLICK_MS / TARGET_FIREWORK_COUNT_PER_CLICK; // Interval stays constant
        const MAX_DELTA_TIME_MS = 200; // Maximum delta time to process in one go (prevents catch-up lag)

        // --- DOM Element References ---
        const mainContent = document.getElementById('main-content');
        const startButton = document.getElementById('start-button');
        const creditText = document.getElementById('credit-text');
        const animationArea = document.getElementById('animation-area');
        const charactersContainer = document.getElementById('characters');
        const turtleEl = document.getElementById('turtle');
        const frogEl = document.getElementById('frog');
        const mushroomEl = document.getElementById('mushroom');
        const statusDisplayEl = document.getElementById('status-display');
        const audioPlayer = document.getElementById('audio-player');
        const backgroundContainer = document.getElementById('background-elements');
        const notesContainer = document.getElementById('music-notes');
        const groundEl = document.getElementById('ground');
        const fullscreenButton = document.getElementById('fullscreen-button');
        const nextSongButton = document.getElementById('next-song-button');
        const characterDivs = document.querySelectorAll('#characters .ascii-art');

        // --- Configuration ---
        const CHARACTER_COLORS = ['text-cyan-400', 'text-yellow-400', 'text-pink-400', 'text-white', 'text-green-400', 'text-red-400'];
        const characterFrames = { // (Frames remain the same)
            turtle: [ `...`, `...`, `...`, `...`, `...`, `...`, `...`, `...` ], // Truncated for brevity
            frog: [ `...`, `...`, `...`, `...`, `...`, `...`, `...`, `...` ],
            mushroom: [ `...`, `...`, `...`, `...`, `...`, `...`, `...`, `...` ]
        };
        // Fill in the actual frames (omitted above for readability)
        characterFrames.turtle = [ `      .--.\n     /.''.\\\n    //    \\\\\n   (| ^  ^ |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `     .--.\n    /.''.\\\n   //    \\\\\n  (| >  ^ |)\n   \\\\ -- //\n    \\'--'/\n    /____\\\n   \`------'\n     || ||\n    /|_|__\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| o  o |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `       .--.\n      /.''.\\\n     //    \\\\\n    (| ^  < |)\n     \\\\ -- //\n      \\'--'/\n      /____\\\n     \`------'\n       || ||\n      /__|_/\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| ^  ^ |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `         .--.\n        /.''.\\\n       //    \\\\\n      (| >  ^ |)\n       \\\\ -- //\n        \\'--'/\n        /____\\\n       \`------'\n         || ||\n        /__|_/\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| o  o |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `     .--.\n    /.''.\\\n   //    \\\\\n  (| ^  < |)\n   \\\\ -- //\n    \\'--'/\n    /____\\\n   \`------'\n     || ||\n    /|_|__\\` ];
        characterFrames.frog = [ `   @..@\n  (----)\n ( >__< )\n ^^ ~~ ^^`, `  @..@\n (----)\n( o__< )\n^^-~~ ^^`, `   @..@\n  (----)\n ( O__O )\n ^^ ~~ ^^`, `  @..@\n (----)\n( >__o )\n^^ ~~-^^`, `   @..@\n  (----)\n ( >__< )\n ^^ ~~ ^^`, `    @..@\n   (----)\n  ( o__< )\n ^^ ~~-^^`, `   @..@\n  (----)\n ( O__O )\n ^^ ~~ ^^`, `    @..@\n   (----)\n  ( >__o )\n ^^-~~ ^^` ];
        characterFrames.mushroom = [ `      .--.\n     /    \\\n    | O  O |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `       .--.\n      /    \\\n     | o  O |\n     \\ ---- /\n      \`----'\n       |__|\n      /    \\\n     \`------'`, `      .--.\n     /    \\\n    | o  o |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `     .--.\n    /    \\\n   | O  o |\n   \\ ---- /\n    \`----'\n     |__|\n    /    \\\n   \`------'`, `      .--.\n     /    \\\n    | O  O |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `       .--.\n      /    \\\n     | o  O |\n     \\ ---- /\n      \`----'\n       |__|\n      /    \\\n     \`------'`, `      .--.\n     /    \\\n    | o  o |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `     .--.\n    /    \\\n   | O  o |\n   \\ ---- /\n    \`----'\n     |__|\n    /    \\\n   \`------'` ];

        const NUM_FRAMES = characterFrames.turtle.length;
        const backgroundFrames = [
            { element: '*', color: 'text-gray-500', positions: [{x: '10%', y: '10%'}, {x: '30%', y: '20%'}, {x: '50%', y: '10%'}, {x: '70%', y: '30%'}, {x: '85%', y: '15%'}, {x: '95%', y: '25%'}] },
            { element: '~', color: 'text-blue-300', positions: [{x: '5%', y: '15%'}, {x: '25%', y: '25%'}, {x: '45%', y: '10%'}, {x: '65%', y: '35%'}, {x: '80%', y: '20%'}, {x: '90%', y: '10%'}] },
            { element: '.', color: 'text-gray-600', positions: [{x: '15%', y: '20%'}, {x: '35%', y: '10%'}, {x: '55%', y: '30%'}, {x: '75%', y: '15%'}, {x: '90%', y: '35%'}, {x: '5%', y: '30%'}] }
        ];
        const MUSIC_NOTE_SYMBOLS = ['♪', '♫', '♩'];
        const MUSIC_NOTE_COLOR = 'text-yellow-300';
        let activeMusicNotes = [];
        const classicalMelodies = [
            { Name: "Geminiani Allegro",       AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_demicheli_geminiani_pieces_allegro-in-f-major_small-version.wav" },
            { Name: "Anonymous Elysium",       AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_elysium_anonymous-elysium_the-young-false-man_small-version_live-and_restored.wav" },
            { Name: "Porpora Notturno",        AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_ensemble-la-tempesta_porpora_iii-notturno_iii-lezione_live_small-version.wav" },
            { Name: "Thuille Sestetto",        AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_fiati-di-parma_thuille_terzo-tempo_sestetto_small-version.wav" },
            { Name: "Bach Fugue BWV 532",      AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_latry_bach_fugue_in_d_major_bwv-532_live_cut-version.wav" },
            { Name: "Bach Partita BWV 827",    AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_luisi_bach_partita_a-minor_bwv-827_1_small-version.wav" },
            { Name: "Chopin Scherzo (Middle)", AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_luisi_chopin_scherzo_2_31_small-version_i-middle.wav" },
            { Name: "Chopin Scherzo (Ending)", AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_luisi_chopin_scherzo_2_31_small-version_ii-ending.wav" },
            { Name: "Froberger Tombeau",       AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_riva_froberger_tombeau-de-m-blancheroche_small-version.wav" },
            { Name: "Anonymous Riflessi",      AudioSource: "https://archive.org/download/onclassical-quality-wav-audio-files-of-classical-music/onclassical_demo_roccato_anonymous-roccato_riflessi_small-version.wav" }
        ];

        // --- Animation State Variables ---
        let frameIndex = 0;
        let colorIndex = 0;
        let backgroundFrameIndex = 0;
        let currentMelodyIndex = -1;
        let audioLoadTimeout;
        let animationFrameId = null;
        let lastTimestamp = 0;
        let timeAccumulator = 0;
        let hasStarted = false;
        let bounceTimers = {}; // Store bounce timeouts per character ID
        let randomFireworksIntervalId = null;
        let stopFireworksTimeoutId = null;
        let cumulativeEffectEndTime = 0; // Timestamp when effects should end

        // --- Platform Detection ---
        function isAppleDevice() {
            return APPLE_PLATFORMS_REGEX.test(navigator.platform);
        }
        if (isAppleDevice() && fullscreenButton) {
            fullscreenButton.classList.add('hidden');
        }

        // --- Core Functions ---
        function updateStatus(message, isError = false) {
            if (!statusDisplayEl) return;
            statusDisplayEl.textContent = `Status: ${message}`;
            statusDisplayEl.classList.toggle('text-red-500', isError);
            statusDisplayEl.classList.toggle('text-yellow-400', !isError);
        }

        /** --- MODIFIED: animationLoop caps deltaTime and uses while loop --- */
        function animationLoop(timestamp) {
            if (!hasStarted) return;
            if (!lastTimestamp) lastTimestamp = timestamp; // Initialize timestamp on first frame

            let deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp; // Update last timestamp for the next frame

            // --- Prevent huge jumps in time when tab loses focus ---
            deltaTime = Math.min(deltaTime, MAX_DELTA_TIME_MS); // Cap delta time

            timeAccumulator += deltaTime; // Add potentially capped elapsed time

            // --- Process accumulated time in discrete steps ---
            // Use while loop to handle cases where deltaTime > ANIMATION_DELAY_MS
            while (timeAccumulator >= ANIMATION_DELAY_MS) {
                updateAnimationFrameContent(); // Perform one frame update
                timeAccumulator -= ANIMATION_DELAY_MS; // Decrease accumulator
            }

            // Request the next frame, continuing the loop
            animationFrameId = requestAnimationFrame(animationLoop);
        }


        function updateAnimationFrameContent() {
            try {
                 if (!turtleEl || !frogEl || !mushroomEl || !backgroundContainer || !notesContainer) {
                     console.error("Required animation elements not found during update.");
                     updateStatus("Animation elements missing. Check console.", true);
                     stopAnimation();
                     return;
                 }

                const visualFrameIndex = frameIndex % NUM_FRAMES;
                const currentBgFrameData = backgroundFrames[backgroundFrameIndex];
                const currentColorClass = CHARACTER_COLORS[colorIndex];

                // Update Characters (ASCII and Color)
                turtleEl.textContent = characterFrames.turtle[visualFrameIndex];
                frogEl.textContent = characterFrames.frog[visualFrameIndex];
                mushroomEl.textContent = characterFrames.mushroom[visualFrameIndex];

                [turtleEl, frogEl, mushroomEl].forEach(el => {
                    el.classList.remove(...CHARACTER_COLORS);
                    el.classList.add(currentColorClass);
                });

                // Update Background
                backgroundContainer.innerHTML = '';
                currentBgFrameData.positions.forEach(pos => {
                    const bgEl = document.createElement('div');
                    bgEl.textContent = currentBgFrameData.element;
                    bgEl.className = `absolute ${currentBgFrameData.color} text-xl pointer-events-none`;
                    bgEl.style.left = pos.x;
                    bgEl.style.top = pos.y;
                    backgroundContainer.appendChild(bgEl);
                });

                // Update Music Notes
                updateMusicNotes();

                // Increment Frame Counters
                frameIndex++;
                if (frameIndex % CHARACTER_COLOR_CHANGE_INTERVAL === 0) {
                    colorIndex = (colorIndex + 1) % CHARACTER_COLORS.length;
                }
                if (frameIndex % BACKGROUND_CHANGE_INTERVAL === 0) {
                    backgroundFrameIndex = (backgroundFrameIndex + 1) % backgroundFrames.length;
                }
            } catch (error) {
                console.error("Error during animation frame update:", error);
                updateStatus("Animation error. Check console.", true);
                stopAnimation();
            }
        }

        function updateMusicNotes() {
            if (!notesContainer) return;
            const notesToRemove = [];

            activeMusicNotes.forEach((noteData, index) => {
                noteData.y -= 1;
                noteData.element.style.top = `${noteData.y}%`;
                if (noteData.y < 5) {
                    if(notesContainer.contains(noteData.element)) {
                        notesContainer.removeChild(noteData.element);
                    }
                    notesToRemove.push(index);
                }
            });

            for (let i = notesToRemove.length - 1; i >= 0; i--) {
                activeMusicNotes.splice(notesToRemove[i], 1);
            }

            if (Math.random() < MUSIC_NOTE_SPAWN_CHANCE) {
                const noteEl = document.createElement('div');
                noteEl.textContent = MUSIC_NOTE_SYMBOLS[Math.floor(Math.random() * MUSIC_NOTE_SYMBOLS.length)];
                noteEl.className = `music-note ${MUSIC_NOTE_COLOR}`;
                const startX = Math.random() * 80 + 10;
                const startY = 85;
                noteEl.style.left = `${startX}%`;
                noteEl.style.top = `${startY}%`;
                notesContainer.appendChild(noteEl);
                activeMusicNotes.push({ element: noteEl, y: startY });
            }
        }

        function playNextSong(force = false) {
            if (!hasStarted && !force) return;
            if (!audioPlayer) return;

            if (force && audioPlayer.readyState > 0 && !audioPlayer.paused) {
                 audioPlayer.pause();
                 audioPlayer.currentTime = 0;
            } else if (force) {
                 console.log("Audio not playing or ready, skipping directly.");
            }

            clearTimeout(audioLoadTimeout);

            if (classicalMelodies.length === 0) {
                updateStatus("No melodies available.", true);
                return;
            }

            let nextIndex;
            if (classicalMelodies.length > 1) {
                do {
                    nextIndex = Math.floor(Math.random() * classicalMelodies.length);
                } while (nextIndex === currentMelodyIndex && !force);
            } else {
                 nextIndex = 0;
            }

            currentMelodyIndex = nextIndex;
            const melody = classicalMelodies[currentMelodyIndex];

            console.log(`Attempting to load: ${melody.Name} from ${melody.AudioSource}`);
            updateStatus(`Loading: ${melody.Name}...`);

            try {
                audioPlayer.src = melody.AudioSource;
                audioPlayer.load();

                audioLoadTimeout = setTimeout(() => {
                    if (!audioPlayer.paused || audioPlayer.readyState >= 2) return;
                    console.warn(`Audio loading timed out for ${melody.Name}. Likely CORS or network issue.`);
                    updateStatus(`Error: Failed to load "${melody.Name}". Check console (F12). Trying next...`, true);
                    setTimeout(() => playNextSong(false), 5000);
                }, AUDIO_LOAD_TIMEOUT_MS);
            } catch (error) {
                 console.error(`Error setting audio source or loading ${melody.Name}:`, error);
                 updateStatus(`Error setting source for "${melody.Name}". Check console. Trying next...`, true);
                 setTimeout(() => playNextSong(false), 5000);
            }
        }

        function toggleFullScreen() {
            if (isAppleDevice()) { return; }
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .then(() => { if (fullscreenButton) fullscreenButton.textContent = "Exit Fullscreen"; })
                    .catch(err => {
                        console.error("Fullscreen request failed:", err);
                        updateStatus(`Fullscreen Error: ${err.message}`, true);
                    });
            } else if (document.exitFullscreen) {
                document.exitFullscreen()
                    .then(() => { if (fullscreenButton) fullscreenButton.textContent = "Fullscreen"; });
            }
        }

        function stopAnimation() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            hasStarted = false;
            lastTimestamp = 0; // Reset timestamp on stop
            timeAccumulator = 0; // Reset accumulator on stop
            cumulativeEffectEndTime = 0;

            characterDivs.forEach(div => {
                if (bounceTimers[div.id]) {
                    clearTimeout(bounceTimers[div.id]);
                    delete bounceTimers[div.id];
                }
                div.style.animation = 'none';
            });
            if (randomFireworksIntervalId) {
                clearInterval(randomFireworksIntervalId);
                randomFireworksIntervalId = null;
            }
            if (stopFireworksTimeoutId) {
                clearTimeout(stopFireworksTimeoutId);
                stopFireworksTimeoutId = null;
            }
            console.log("Animation stopped.");
        }

        function startAnimation() {
            if (hasStarted) return;
            console.log("Starting animation and audio...");

             if (!mainContent || !startButton || !creditText || !audioPlayer) {
                console.error("Cannot start: Core UI elements missing.");
                updateStatus("Initialization Error. Check console.", true);
                return;
             }

            hasStarted = true;

            // Update UI
            startButton.classList.add('hidden');
            creditText.classList.add('hidden');
            mainContent.classList.remove('hidden');
            mainContent.classList.add('flex');

            // Reset JS Animation State & Start Loop
            frameIndex = 0;
            colorIndex = 0;
            backgroundFrameIndex = 0;
            lastTimestamp = 0; // Reset timestamp on start
            timeAccumulator = 0; // Reset accumulator on start
            cumulativeEffectEndTime = 0;
            if (animationFrameId) cancelAnimationFrame(animationFrameId); // Clear just in case
            animationFrameId = requestAnimationFrame(animationLoop);

            // Handle Audio Playback
            const currentMelody = classicalMelodies[currentMelodyIndex];
            if (audioPlayer.src && audioPlayer.readyState < 2 && audioPlayer.src !== window.location.href) {
                 updateStatus(`Resuming load: ${currentMelody?.Name || 'Unknown'}...`);
            }
            else if (audioPlayer.src && audioPlayer.paused && audioPlayer.src !== window.location.href) {
                updateStatus(`Resuming: ${currentMelody?.Name || 'Unknown'}...`);
                audioPlayer.play().catch(handleAudioPlaybackError);
            }
            else {
                playNextSong(false);
            }

            // Render first frame immediately (optional, loop will handle it)
            // updateAnimationFrameContent();
        }

        function handleAudioPlaybackError(error) {
            clearTimeout(audioLoadTimeout);
            const melodyName = classicalMelodies[currentMelodyIndex]?.Name || 'Unknown';
            console.error(`Error playing/resuming audio "${melodyName}":`, error);
            updateStatus(`Playback Error: "${melodyName}". Check console (F12). Trying next...`, true);
            if (hasStarted) { setTimeout(() => playNextSong(false), 5000); }
        }

        function startOrExtendEffects() {
            const now = Date.now();
            const remainingDuration = cumulativeEffectEndTime - now;

            // Bounce
            characterDivs.forEach(div => {
                if (bounceTimers[div.id]) { clearTimeout(bounceTimers[div.id]); }
                const randomDelay = Math.random() * 0.4;
                div.style.animationName = 'bounce';
                div.style.animationDuration = BOUNCE_DURATION;
                div.style.animationTimingFunction = 'ease-in-out';
                div.style.animationIterationCount = 'infinite';
                div.style.animationDelay = `${randomDelay.toFixed(2)}s`;
                div.style.animationPlayState = 'running';

                if (remainingDuration > 0) {
                    bounceTimers[div.id] = setTimeout(() => {
                        div.style.animation = 'none';
                        delete bounceTimers[div.id];
                    }, remainingDuration);
                } else {
                    div.style.animation = 'none';
                    delete bounceTimers[div.id];
                }
            });

            // Fireworks
            if (randomFireworksIntervalId) { clearInterval(randomFireworksIntervalId); }
            if (stopFireworksTimeoutId) { clearTimeout(stopFireworksTimeoutId); }

            if (remainingDuration > 0) {
                randomFireworksIntervalId = setInterval(triggerRandomFirework, FIREWORK_INTERVAL_MS);
                stopFireworksTimeoutId = setTimeout(() => {
                    if (randomFireworksIntervalId) {
                        clearInterval(randomFireworksIntervalId);
                        randomFireworksIntervalId = null;
                    }
                    stopFireworksTimeoutId = null;
                }, remainingDuration);
            } else {
                randomFireworksIntervalId = null;
                stopFireworksTimeoutId = null;
            }
        }

        function triggerRandomFirework() {
            if (!animationArea) return;
            const areaWidth = animationArea.offsetWidth;
            const areaHeight = animationArea.offsetHeight;
            const randomX = Math.random() * areaWidth;
            const randomY = Math.random() * areaHeight * 0.6; // Top 60%
            createFireworks(randomX, randomY);
        }


        function createFireworks(clickX, clickY) {
            if (!animationArea) return; // Safety check

            const container = document.createElement('div');
            container.className = 'fireworks-container';
            container.style.left = `${clickX}px`;
            container.style.top = `${clickY}px`;
            animationArea.appendChild(container);

            for (let i = 0; i < FIREWORK_PARTICLE_COUNT; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
                container.appendChild(particle);
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * FIREWORK_SPREAD + FIREWORK_SPREAD / 2;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;

                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${targetX}px, ${targetY}px) scale(0.5)`;
                    particle.style.opacity = '0';
                });
            }

            setTimeout(() => {
                // Check if container still exists before removing
                if (animationArea.contains(container)) {
                    animationArea.removeChild(container);
                }
            }, FIREWORK_DURATION_MS);
        }


        // --- Event Listeners Setup ---
        if (audioPlayer) {
            audioPlayer.addEventListener('canplay', () => {
                clearTimeout(audioLoadTimeout);
                const melody = classicalMelodies[currentMelodyIndex];
                if (!melody || !hasStarted) return;
                updateStatus(`Now Playing: ${melody.Name}`);
                if (audioPlayer.paused) { audioPlayer.play().catch(handleAudioPlaybackError); }
            });
            audioPlayer.addEventListener('ended', () => {
                if (!hasStarted) return;
                updateStatus(`Finished: ${classicalMelodies[currentMelodyIndex]?.Name || 'Unknown'}. Loading next...`);
                playNextSong(false);
            });
            audioPlayer.addEventListener('error', (e) => {
                 if (!hasStarted && audioPlayer.src === window.location.href) { return; }
                clearTimeout(audioLoadTimeout);
                const melodyName = classicalMelodies[currentMelodyIndex]?.Name || 'Unknown Source';
                let errorMsg = `Audio Error for "${melodyName}". `;
                if (audioPlayer.error) {
                    switch (audioPlayer.error.code) {
                        case MediaError.MEDIA_ERR_ABORTED: errorMsg += 'Playback aborted.'; break;
                        case MediaError.MEDIA_ERR_NETWORK: errorMsg += 'Network error.'; break;
                        case MediaError.MEDIA_ERR_DECODE: errorMsg += 'Audio decoding error.'; break;
                        case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: errorMsg += 'Source not supported or CORS issue.'; break;
                        default: errorMsg += 'Unknown error.';
                    }
                     if (audioPlayer.error.code === MediaError.MEDIA_ERR_NETWORK || audioPlayer.error.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
                         errorMsg += ' Check console (F12) for CORS details.';
                     }
                } else { errorMsg += 'Unknown error occurred.'; }
                console.error(`Audio player error detail:`, e);
                console.error(`Player error object:`, audioPlayer.error);
                errorMsg += ' Trying next...'
                updateStatus(errorMsg, true);
                if (hasStarted) { setTimeout(() => playNextSong(false), 5000); }
            });
        } else {
            console.error("Audio player element (#audio-player) not found in the DOM.");
            updateStatus("Audio player missing.", true);
        }

        if (startButton) {
            startButton.addEventListener('click', () => {
                try { startAnimation(); } catch (error) {
                    console.error("Error starting animation:", error);
                    updateStatus("Failed to start animation. Check console.", true);
                    hasStarted = false;
                }
            });
        } else { console.error("Start button element (#start-button) not found."); }

        if (fullscreenButton) { fullscreenButton.addEventListener('click', toggleFullScreen); }

        if (nextSongButton) {
            nextSongButton.addEventListener('click', () => {
                if (hasStarted) { playNextSong(true); } else {
                    updateStatus("Click 'Start Dancing Trio' first.", false);
                }
            });
        } else { console.error("Next song button element (#next-song-button) not found."); }

        if (animationArea) {
            animationArea.addEventListener('click', (event) => {
                if (!hasStarted) return;
                const rect = animationArea.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                const now = Date.now();

                createFireworks(x, y);

                cumulativeEffectEndTime = Math.max(now, cumulativeEffectEndTime) + EFFECT_DURATION_PER_CLICK_MS;
                console.log(`Effect extended. New end time: ${new Date(cumulativeEffectEndTime).toLocaleTimeString()}`);

                startOrExtendEffects();
            });
        } else {
            console.error("Animation area element (#animation-area) not found.");
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            console.log("DOM fully loaded. Initializing...");
            // Restore original ASCII frames that were truncated
            characterFrames.turtle = [ `      .--.\n     /.''.\\\n    //    \\\\\n   (| ^  ^ |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `     .--.\n    /.''.\\\n   //    \\\\\n  (| >  ^ |)\n   \\\\ -- //\n    \\'--'/\n    /____\\\n   \`------'\n     || ||\n    /|_|__\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| o  o |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `       .--.\n      /.''.\\\n     //    \\\\\n    (| ^  < |)\n     \\\\ -- //\n      \\'--'/\n      /____\\\n     \`------'\n       || ||\n      /__|_/\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| ^  ^ |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `         .--.\n        /.''.\\\n       //    \\\\\n      (| >  ^ |)\n       \\\\ -- //\n        \\'--'/\n        /____\\\n       \`------'\n         || ||\n        /__|_/\\`, `      .--.\n     /.''.\\\n    //    \\\\\n   (| o  o |)\n    \\\\ -- //\n     \\'--'/\n     /____\\\n    \`------'\n      || ||\n     /__|__\\`, `     .--.\n    /.''.\\\n   //    \\\\\n  (| ^  < |)\n   \\\\ -- //\n    \\'--'/\n    /____\\\n   \`------'\n     || ||\n    /|_|__\\` ];
            characterFrames.frog = [ `   @..@\n  (----)\n ( >__< )\n ^^ ~~ ^^`, `  @..@\n (----)\n( o__< )\n^^-~~ ^^`, `   @..@\n  (----)\n ( O__O )\n ^^ ~~ ^^`, `  @..@\n (----)\n( >__o )\n^^ ~~-^^`, `   @..@\n  (----)\n ( >__< )\n ^^ ~~ ^^`, `    @..@\n   (----)\n  ( o__< )\n ^^ ~~-^^`, `   @..@\n  (----)\n ( O__O )\n ^^ ~~ ^^`, `    @..@\n   (----)\n  ( >__o )\n ^^-~~ ^^` ];
            characterFrames.mushroom = [ `      .--.\n     /    \\\n    | O  O |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `       .--.\n      /    \\\n     | o  O |\n     \\ ---- /\n      \`----'\n       |__|\n      /    \\\n     \`------'`, `      .--.\n     /    \\\n    | o  o |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `     .--.\n    /    \\\n   | O  o |\n   \\ ---- /\n    \`----'\n     |__|\n    /    \\\n   \`------'`, `      .--.\n     /    \\\n    | O  O |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `       .--.\n      /    \\\n     | o  O |\n     \\ ---- /\n      \`----'\n       |__|\n      /    \\\n     \`------'`, `      .--.\n     /    \\\n    | o  o |\n    \\ ---- /\n     \`----'\n      |__|\n     /    \\\n    \`------'`, `     .--.\n    /    \\\n   | O  o |\n   \\ ---- /\n    \`----'\n     |__|\n    /    \\\n   \`------'` ];

            const essentialElementsExist = mainContent && startButton && creditText && animationArea && audioPlayer && statusDisplayEl && charactersContainer && turtleEl && frogEl && mushroomEl && backgroundContainer && notesContainer && characterDivs.length === 3;

            if (!essentialElementsExist) {
                 updateStatus("Initialization failed: Page structure incomplete.", true);
                 console.error("One or more essential elements are missing from the page. Check element IDs.");
                 if(startButton) startButton.disabled = true;
                 return;
            }
            updateStatus("Ready. Click 'Start Dancing Trio'.");
            console.log("App initialized. Click 'Start Dancing Trio' to begin.");
        });
